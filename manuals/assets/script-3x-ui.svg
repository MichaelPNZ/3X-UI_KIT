lyphs">Ставлю 3X-UI v3.8.5 официальным установщиком (пара минут)</text><text x="22.00" y="154" class="m" font-size="13.5" fill="#93e06f" xml:space="preserve" textLength="32.51" lengthAdjust="spacingAndGlyphs">==&gt; </text><text x="54.51" y="154" class="m" font-size="13.5" fill="#fbf6ec" xml:space="preserve" textLength="544.51" lengthAdjust="spacingAndGlyphs">Создаю подключения: REALITY, Hysteria2, XHTTP, WS, gRPC, AmneziaWG…</text><text x="22.00" y="175" class="m" font-size="13.5" fill="#93e06f" xml:space="preserve" textLength="32.51" lengthAdjust="spacingAndGlyphs">==&gt; </text><text x="54.51" y="175" class="m" font-size="13.5" fill="#fbf6ec" xml:space="preserve" textLength="325.08" lengthAdjust="spacingAndGlyphs">Настраиваю nginx: всё TCP через порт 443</text><text x="22.00" y="217" class="m" font-size="13.5" fill="#93e06f" xml:space="preserve" textLength="471.37" lengthAdjust="spacingAndGlyphs">  _ _                   _   _          _          _      _</text><text x="22.00" y="238" class="m" font-size="13.5" fill="#93e06f" xml:space="preserve" textLength="503.87" lengthAdjust="spacingAndGlyphs"> (_) |_ ___ _ __   ___ | |_| | ___   _| |__  _ __(_) ___| | __</text><text x="22.00" y="259" class="m" font-size="13.5" fill="#93e06f" xml:space="preserve" textLength="503.87" lengthAdjust="spacingAndGlyphs"> | | __/ __| &#x27;_ \ / _ \| __| |/ / | | | &#x27;_ \| &#x27;__| |/ __| |/ /</text><text x="22.00" y="280" class="m" font-size="13.5" fill="#93e06f" xml:space="preserve" textLength="495.75" lengthAdjust="spacingAndGlyphs"> | | |_\__ \ | | | (_) | |_|   &lt;| |_| | |_) | |  | | (__|   &lt;</text><text x="22.00" y="301" class="m" font-size="13.5" fill="#93e06f" xml:space="preserve" textLength="503.87" lengthAdjust="spacingAndGlyphs"> |_|\__|___/_| |_|\___/ \__|_|\_\\__,_|_.__/|_|  |_|\___|_|\_\</text><text x="22.00" y="343" class="m" font-size="13.5" fill="#fbf6ec" font-weight="700" xml:space="preserve" textLength="73.14" lengthAdjust="spacingAndGlyphs">3X-UI KIT</tex